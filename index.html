<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>truth.tv Overlay</title>

<style>
  @font-face{
    font-family:'Neue Haas Grotesk Display Pro';
    src: url('fonts/NeueHaasDisplay-Mediu.woff2') format('woff2'),
         url('fonts/NeueHaasDisplay-Mediu.woff') format('woff');
    font-weight: 400; /* "Mediu" cut = normal weight per licensed stylesheet */
    font-style: normal;
    font-display: swap;
  }
  @font-face{
    font-family:'Neue Haas Grotesk Display Pro';
    src: url('fonts/NeueHaasDisplay-MediumItalic.woff2') format('woff2'),
         url('fonts/NeueHaasDisplay-MediumItalic.woff') format('woff');
    font-weight: 400;
    font-style: italic;
    font-display: swap;
  }
  @font-face{
    font-family:'Neue Haas Grotesk Display Pro';
    src: url('fonts/NeueHaasDisplay-Black.woff2') format('woff2'),
         url('fonts/NeueHaasDisplay-Black.woff') format('woff');
    font-weight: 900;
    font-style: normal;
    font-display: swap;
  }
  :root{
    --red-breaking: #cb3233;
    --red-logo: #c22026;
    --ticker-bg: rgba(17,19,33,0.29);
    --dark-bar: #231f20;
    --black-bar: #000101;
    --white: #ffffff;
    --off-white: #e2ece9;
    --credit-white: #e1edf8;

    --font-medium: 'Neue Haas Grotesk Display Pro', 'Neue Haas Display Medium', 'Helvetica Now Text', 'Inter', Arial, sans-serif;
    --font-black: 'Neue Haas Grotesk Display Pro', 'Neue Haas Display Black', 'Helvetica Now Text', 'Inter', Arial, sans-serif;
    --font-italic: 'Neue Haas Grotesk Display Pro', 'Neue Haas Display Medium Italic', 'Helvetica Now Text', 'Inter', Arial, sans-serif;
  }

  html,body{
    margin:0;
    padding:0;
    background:transparent;
    width:100vw;
    height:100vh;
    overflow:hidden;
    font-family: var(--font-medium);
  }

  #stage{
    position:absolute;
    top:0;
    left:0;
    width:921.9px;
    height:518.93px;
    transform-origin: top left;
    /* JS sets the scale() transform below to fill whatever the actual
       browser/OBS source window size is, while keeping every element's
       original px position/size (and thus this whole file) unchanged. */
  }

  /* ===== BREAKING TAG ===== */
  #breaking-tag{
    position:absolute;
    left:61.5px;
    top:355.2px;
    width:148.1px;
    height:23.8px;
    background:var(--red-breaking);
    display:flex;
    align-items:center;
    padding-left: 12px;
    box-sizing:border-box;
  }
  #breaking-tag span{
    color:var(--off-white);
    font-size:16.31px;
    font-weight:400;
    letter-spacing:0.5px;
  }

  /* ===== HEADLINE BOX ===== */
  #headline-box{
    position:absolute;
    left:61.5px;
    top:379.1px;
    width:685.1px;
    height:60.5px;
    background:var(--white);
    box-sizing:border-box;
    padding: 6px 14px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow:hidden;
    visibility:hidden; /* revealed by JS once autofit has run, prevents overflow flash */
  }
  #headline-box.ready{ visibility:visible; }
  #headline-main{
    color:#231f20;
    font-size:19.3px;
    font-weight:400;
    line-height:1.18;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #headline-sub{
    color:#231f20;
    font-size:19.3px;
    font-weight:400;
    line-height:1.18;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ===== LOGO BLOCK (right) ===== */
  #live-news{
    position:absolute;
    left:769.5px;
    top:356.4px;
    width:105.4px;
    height:17.4px;
    background:var(--white);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #live-news span{
    color:#000101;
    font-size:12.41px;
    font-weight:400;
    letter-spacing:0.5px;
  }

  #truth-logo{
    position:absolute;
    left:769.5px;
    top:374px;
    width:105.4px;
    height:64.2px;
    background:var(--red-logo);
    display:flex;
    align-items:center;
    justify-content:center;
    box-sizing:border-box;
    padding: 8px 14px;
  }
  #truth-logo img{
    width:100%;
    height:auto;
    display:block;
  }

  #provided-by{
    position:absolute;
    left:769.5px;
    top:438.4px;
    width:105.4px;
    height:10.3px;
    background:var(--dark-bar);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #provided-by span{
    color:var(--credit-white);
    font-size:7.4px;
    font-weight:400;
    letter-spacing:0.5px;
  }

  /* ===== TICKER BAR ===== */
  #ticker-bar{
    position:absolute;
    left:61.5px;
    top:449.9px;
    width:813.4px;
    height:35.4px;
    background:var(--ticker-bg);
    overflow:hidden;
    display:flex;
    align-items:center;
  }
  #ticker-track{
    display:inline-flex;
    white-space:nowrap;
    will-change:transform;
    animation: scroll-ticker linear infinite;
  }
  #ticker-track span.item{
    color:var(--off-white);
    font-size:16.31px;
    font-weight:400;
    padding-right:80px;
  }

  @keyframes scroll-ticker{
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
</style>
</head>
<body>

<div id="stage">

  <div id="breaking-tag"><span>BREAKING</span></div>

  <div id="headline-box">
    <div id="headline-main"></div>
    <div id="headline-sub"></div>
  </div>

  <div id="live-news"><span>LIVE NEWS</span></div>

  <div id="truth-logo">
    <img src="truth-logo.svg" alt="truth.tv" />
  </div>

  <div id="provided-by"><span>PROVIDED BY XENIT</span></div>

  <div id="ticker-bar">
    <div id="ticker-track"></div>
  </div>

</div>

<script>
/* =========================================================
   EDIT YOUR CONTENT HERE — this is the only section you need
   ========================================================= */
const CONFIG = {
  headlineMain: "THERE IS A FUCKING BLUE BLOB",
  headlineSub:  "ignore the fucking empty space",
  tickerText:   "INSERT FUCKING BOTTOM HEADLINES — UPDATE ME IN config.json OR RIGHT HERE",
  tickerSpeedPxPerSecond: 90   // higher = faster scroll
};
/* ========================================================= */

// Try to load an external config.json if present (so you can edit
// text without touching this file at all). Falls back to CONFIG above.
async function loadConfig(){
  try{
    const res = await fetch('config.json', {cache:'no-store'});
    if(res.ok){
      const json = await res.json();
      return { ...CONFIG, ...json };
    } else {
      console.warn('[config] config.json responded with status', res.status, '- using inline CONFIG defaults');
    }
  }catch(e){
    console.warn('[config] Could not fetch config.json (likely opened via file:// or hosting issue). Using inline CONFIG defaults. Error:', e.message);
  }
  return CONFIG;
}

function autoFitText(el, maxWidth){
  // Shrinks font-size step by step until the text fits on one line,
  // so long headlines never overflow the white box.
  let size = parseFloat(getComputedStyle(el).fontSize);
  const minSize = 12;
  el.style.whiteSpace = 'nowrap';
  while (el.scrollWidth > maxWidth && size > minSize){
    size -= 0.5;
    el.style.fontSize = size + 'px';
  }
}

function buildTicker(text, speed){
  const track = document.getElementById('ticker-track');
  track.innerHTML = '';

  // duplicate content twice so the loop is seamless (translateX -50%)
  const seg1 = document.createElement('span');
  seg1.className = 'item';
  seg1.textContent = text;

  const seg2 = document.createElement('span');
  seg2.className = 'item';
  seg2.textContent = text;

  track.appendChild(seg1);
  track.appendChild(seg2);

  // Measure width of ONE segment to set animation duration based on speed.
  // Safe to measure synchronously here because init() already awaited
  // document.fonts.ready before calling this — text is laid out in its
  // final font, so this width is accurate (no more post-swap jump/snap).
  const segWidth = seg1.getBoundingClientRect().width + 80; // + padding-right
  const duration = segWidth / speed;
  track.style.animationDuration = duration + 's';
}

const DESIGN_WIDTH = 921.9;
const DESIGN_HEIGHT = 518.93;

function scaleStage(){
  const stage = document.getElementById('stage');
  const scaleX = window.innerWidth / DESIGN_WIDTH;
  const scaleY = window.innerHeight / DESIGN_HEIGHT;
  // 'cover' behavior: fills the whole OBS canvas edge to edge, cropping
  // whichever dimension overflows if the aspect ratio doesn't match.
  // Swap Math.max -> Math.min if you'd rather never crop (may letterbox).
  const scale = Math.max(scaleX, scaleY);
  stage.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', scaleStage);
scaleStage();

function checkFontLoaded(){
  // Logs to console (visible via OBS Browser Source > right-click > Interact > F12,
  // or just open index.html in a normal Chrome tab and hit F12) so you can confirm
  // whether the CDN font actually loaded or it's silently using the fallback.
  if(document.fonts && document.fonts.check){
    const loaded400 = document.fonts.check('400 16px "Neue Haas Grotesk Display Pro"');
    const loaded900 = document.fonts.check('900 16px "Neue Haas Grotesk Display Pro"');
    console.log('[font-check] Mediu(400) loaded:', loaded400, '| Black(900) loaded:', loaded900);
    if(!loaded400 && !loaded900){
      console.warn('[font-check] Neue Haas NOT loaded — currently showing fallback font. Check network tab for blocked requests to fonts.cdnfonts.com');
    }
  }
}

async function init(){
  const cfg = await loadConfig();

  // CRITICAL: wait for the real webfont to finish loading before measuring
  // anything. If we build the ticker or autofit headlines against the
  // fallback font's widths, the numbers are wrong the instant Neue Haas
  // swaps in — causing a visible jump/snap in the ticker loop and
  // slightly-off autofit sizing. document.fonts.ready resolves once every
  // requested @font-face has finished loading (or failed + fell back).
  await document.fonts.ready;
  checkFontLoaded();

  document.getElementById('headline-main').textContent = cfg.headlineMain;
  document.getElementById('headline-sub').textContent  = cfg.headlineSub;

  // autofit both headline lines so they never overflow the white box
  const box = document.getElementById('headline-box');
  const innerWidth = box.clientWidth - 28; // minus left/right padding
  autoFitText(document.getElementById('headline-main'), innerWidth);
  autoFitText(document.getElementById('headline-sub'), innerWidth);
  box.classList.add('ready');

  buildTicker(cfg.tickerText, cfg.tickerSpeedPxPerSecond || 90);
}

init();

// Optional: auto-refresh content every 10s by re-reading config.json,
// so you can update headlines live without restarting OBS.
setInterval(async () => {
  const cfg = await loadConfig();
  const mainEl = document.getElementById('headline-main');
  const subEl  = document.getElementById('headline-sub');
  const tickerEl = document.getElementById('ticker-track');

  if(mainEl.textContent !== cfg.headlineMain || subEl.textContent !== cfg.headlineSub){
    mainEl.style.fontSize = '19.3px';
    subEl.style.fontSize = '19.3px';
    mainEl.textContent = cfg.headlineMain;
    subEl.textContent = cfg.headlineSub;
    const box = document.getElementById('headline-box');
    const innerWidth = box.clientWidth - 28;
    autoFitText(mainEl, innerWidth);
    autoFitText(subEl, innerWidth);
  }

  const currentTickerText = cfg.tickerText;
  if(tickerEl.children[0] && tickerEl.children[0].textContent !== currentTickerText){
    buildTicker(currentTickerText, cfg.tickerSpeedPxPerSecond || 90);
  }
}, 10000);
</script>

</body>
</html>
